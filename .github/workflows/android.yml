name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install and test
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      - name: Build web bundle
        env:
          # real AdMob unit ids (optional); without them Google's test ads are used
          VITE_ADMOB_BANNER: ${{ secrets.ADMOB_BANNER_ID }}
          VITE_ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          VITE_ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          npx vite build
          npx cap sync android

      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the APK is signed with the debug key (fine for testing, not for Play)."
          fi

      - name: Gradle build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk ../roadside-empire.apk
          cp app/build/outputs/bundle/release/app-release.aab ../roadside-empire.aab

      - uses: actions/upload-artifact@v4
        with:
          name: roadside-empire-${{ github.run_number }}
          path: |
            roadside-empire.apk
            roadside-empire.aab

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Roadside Empire 0.1.${{ github.run_number }}
          files: |
            roadside-empire.apk
            roadside-empire.aab
